[package]
name = "tinyland"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[lib]
name = "tinyland"
path = "src/lib.rs"

[[bin]]
name = "tinyland"
path = "src/main.rs"

[dependencies]
wayland-server = "0.31"
wayland-protocols = { version = "0.32", features = ["server"] }
drm = "0.15"
rustix = { version = "1.1", features = ["fs", "event", "process", "time"] }
evdev = "0.13"
kbvm = { git = "https://github.com/laputa-systems/kbvm", rev = "c21a0508a6505639ec0d46e6f21a60de2d83e2e4" }
log = "0.4"
env_logger = "0.11"
signal-hook = { version = "0.4", default-features = false }
xkbcommon = { version = "0.9", default-features = false, optional = true }
seatd-protocol = { path = "../seatd-protocol" }

[dev-dependencies]
tempfile = "3"

[features]
oracle = ["dep:xkbcommon"]
headless = []
