[package]
name = "seatd"
version = "0.9.3"
edition = "2021"

[dependencies]
libc = "=0.2.191"
rustix = { package = "laputa-rustix", version = "=1.1.6", registry = "mycrates", features = ["net", "fs"] }
seatd-protocol = { path = "../seatd-protocol" }

[[test]]
name = "adversarial"
path = "harness/adversarial.rs"

[[test]]
name = "differential"
path = "harness/differential.rs"

[[test]]
name = "storm"
path = "harness/storm.rs"
